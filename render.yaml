services:
  - type: web
    name: interviews-app
    runtime: docker
    dockerContext: .
    dockerfilePath: Dockerfile.deployment
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: interviews-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.12.0
    autoDeploy: true

databases:
  - name: interviews-db
    databaseName: interviews
    user: postgres
    plan: free # Can be upgraded later
